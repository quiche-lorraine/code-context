name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: ['lowest', 'highest']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}

      - name: Run test suite
        run: vendor/bin/phpunit -c phpunit.xml.dist

      # Exercises the real binary end-to-end. Running it across the dependency
      # matrix is what catches cross-version breakage such as the Symfony
      # Console add()/addCommand() change between 6.4 and 8.0.
      - name: Generation smoke test
        run: |
          rm -rf /tmp/cc-smoke
          cp -r tests/Fixtures/symfony-mini /tmp/cc-smoke
          php bin/code-context generate --cwd=/tmp/cc-smoke
          test -f /tmp/cc-smoke/.code-context/context.json
          test -f /tmp/cc-smoke/.code-context/AGENTS.md
          php -r '
            $f = "/tmp/cc-smoke/.code-context/context.json";
            $data = json_decode((string) file_get_contents($f), true);
            if (!is_array($data) || !isset($data["php"]["classes"])) {
                fwrite(STDERR, "context.json is missing php.classes\n");
                exit(1);
            }
            // Attributes must be stored structured ({name, arguments}), not as flat strings.
            foreach ($data["php"]["classes"] as $class) {
                foreach ($class["attributes"] ?? [] as $attr) {
                    if (!is_array($attr) || !array_key_exists("name", $attr) || !array_key_exists("arguments", $attr)) {
                        fwrite(STDERR, "attribute is not stored in structured form\n");
                        exit(1);
                    }
                }
            }
            echo "Smoke test OK: ", count($data["php"]["classes"]), " classes analyzed.\n";
          '

  quality:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      - name: PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'
